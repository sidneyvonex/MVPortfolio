# Builds the site (prerendering every page from the live API) and deploys it to the `client` Worker.
# Runs on pushes to main that touch client/, by hand from the Actions tab, and when the admin's
# "Publish site" button sends a `publish-site` repository_dispatch through the API.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/deploy-site.yml']
  workflow_dispatch:
  repository_dispatch:
    types: [publish-site]

# One deploy at a time; a newer publish replaces one still waiting.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Fails if the API cannot be reached, so a broken build never replaces the live site.
      - run: pnpm run build

      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
